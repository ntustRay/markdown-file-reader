[package]
name = "markdown-file-reader"
version = "1.0.0"
description = "A focused local Markdown reader and editor for Android"
authors = ["ntustRay"]
edition = "2021"

[lib]
name = "markdown_file_reader_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-android-content = { path = "plugins/android-content" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
